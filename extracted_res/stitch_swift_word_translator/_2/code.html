</div>
</header>
<main class="flex-grow flex flex-col justify-center px-margin-mobile max-w-lg mx-auto w-full pt-20 pb-32">

<!-- Lower-Center Search Input for Thumb Access -->

<div class="absolute inset-y-0 left-6 flex items-center pointer-events-none text-outline">

<input autofocus="" class="w-full h-14 pl-14 pr-14 bg-surface-container-lowest border border-outline-variant/30 rounded-full text-body-lg focus:ring-1 focus:ring-outline/30 focus:border-outline/50 transition-all duration-300 placeholder:text-outline-variant/70 shadow-sm" placeholder="键入单词或长句..." type="text"/>

</button>
</div>
</div>
</section>
<!-- Recent Discovery / History -->
<section class="mt-8 px-2 animate-in fade-in slide-in-from-bottom-4 duration-700">
<div class="flex justify-between items-center mb-6">
<h2 class="font-label-md text-outline uppercase tracking-widest text-xs">最近查阅</h2>
<button class="text-xs text-outline hover:text-on-surface transition-colors tracking-wide">清空</button>

</div>
<div class="flex items-center justify-between py-4 border-b border-outline-variant/20 active:opacity-50 transition-opacity cursor-pointer group">
<div class="flex flex-col">

<script>
        // Search bar focus interaction
        const searchInput = document.querySelector('input');
        const searchContainer = searchInput.parentElement;

        searchInput.addEventListener('focus', () => {
            searchContainer.classList.add('scale-[1.01]');
        });

        searchInput.addEventListener('blur', () => {
            searchContainer.classList.remove('scale-[1.01]');
        });

        // Navigation state simulation
        const navButtons = document.querySelectorAll('nav button');
        navButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                navButtons.forEach(b => {
                    b.className = "flex flex-col items-center justify-center text-outline hover:text-on-surface active:scale-[0.98] transition-all duration-200 w-16";
                    b.querySelector('span:first-child').style.fontVariationSettings = "'FILL' 0";
                });
                btn.className = "flex flex-col items-center justify-center text-primary font-medium active:scale-[0.98] transition-all duration-200 w-16";
                btn.querySelector('span:first-child').style.fontVariationSettings = "'FILL' 1";
            });
        });
    </script>
